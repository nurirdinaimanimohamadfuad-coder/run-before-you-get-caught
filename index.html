<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>PHANTOM RUSH ROBLOX</title><style>@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Creepster&display=swap');*{margin:0;padding:0;box-sizing:border-box;touch-action:none}body{background:#000;overflow:hidden;font-family:Fredoka;color:#fff}#top{position:absolute;top:0;width:100%;display:flex;justify-content:space-between;padding:10px;z-index:10}.badge{background:rgba(0,0,0,.7);padding:6px 12px;border-radius:10px;border:1px solid #444;font-size:12px}#title{position:absolute;inset:0;background:radial-gradient(#400,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center}#title h1{font-family:Creepster;font-size:58px;color:red;text-shadow:0 0 20px red}.card{background:#111;border:2px solid red;padding:14px;border-radius:14px;margin:14px;width:85%;max-width:320px}.btn{background:red;color:#fff;border:none;padding:14px 32px;border-radius:12px;font-family:Creepster;font-size:22px;box-shadow:0 0 20px red}#joy{position:absolute;bottom:22px;left:18px;width:120px;height:120px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.4);border-radius:50%;z-index:15}#stick{position:absolute;left:50%;top:50%;width:52px;height:52px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}#jump{position:absolute;bottom:28px;right:22px;width:92px;height:92px;background:rgba(255,0,0,.45);border:2px solid red;border-radius:50%;z-index:15;display:flex;align-items:center;justify-content:center;font-weight:bold}#over{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#111;border:2px solid red;padding:24px;border-radius:14px;display:none;text-align:center;z-index:30;width:85%}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script></head><body><div id="top"><div class="badge">🏃 <span id="d">0</span>m</div><div class="badge">⭐ <span id="s">0</span></div><div class="badge">👻 <span id="b">20</span>m</div></div><div id="title"><h1>PHANTOM RUSH</h1><p style="color:#ff7777;letter-spacing:3px">ROBLOX STYLE</p><div class="card">🕹️ Joystick kiri = gerak<br>🔴 Kanan = Lompat<br>🟢 Pintu hijau = Jawapan betul = tolak hantu</div><button class="btn" onclick="start()">▶ PLAY</button></div><div id="over"><h2 style="font-family:Creepster;color:red;font-size:42px">CAUGHT!</h2><p id="f" style="margin:12px 0"></p><button class="btn" onclick="location.reload()">RESPAWN</button></div><div id="joy"><div id="stick"></div></div><div id="jump">JUMP</div><script type="module">import * as THREE from 'three';let scene,camera,renderer,player,ph,gates=[],clock=new THREE.Clock(),run=false,over=false,dist=0,score=0,mx=0,mz=0,vy=0,y=0,jump=false;scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0a0a);scene.fog=new THREE.Fog(0x0a0a0a,15,80);camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,300);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,1.2));let dir=new THREE.DirectionalLight(0xffffff,1);dir.position.set(10,20,10);scene.add(dir);let ground=new THREE.Mesh(new THREE.PlaneGeometry(200,3000),new THREE.MeshStandardMaterial({color:0x191919}));ground.rotation.x=-Math.PI/2;scene.add(ground);let pg=new THREE.Group();pg.add(new THREE.Mesh(new THREE.BoxGeometry(0.9,1.1,0.6),new THREE.MeshStandardMaterial({color:0x00a2ff})).translateY(1.3));pg.add(new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6),new THREE.MeshStandardMaterial({color:0xffdbac})).translateY(2.3));scene.add(pg);player=pg;let hg=new THREE.Group();let hm=new THREE.Mesh(new THREE.BoxGeometry(1,1.2,0.6),new THREE.MeshStandardMaterial({color:0x111,emissive:0xff0000,emissiveIntensity:0.8}));hm.position.y=1.4;hg.add(hm);hg.position.set(0,0,-22);scene.add(hg);ph=hg;function spawn(z){let q=[{q:"5+3",a:8},{q:"6x7",a:42},{q:"9x9",a:81},{q:"12+15",a:27}][Math.random()*4|0];let ans=q.a;let opts=[ans,ans+Math.floor(Math.random()*8+1),ans-Math.floor(Math.random()*8+1)].sort(()=>Math.random()-.5);opts.forEach((v,i)=>{let x=(i-1)*5.5;let isOk=v===ans;let mat=new THREE.MeshStandardMaterial({color:isOk?0x00cc55:0xcc2222});let w=new THREE.Mesh(new THREE.BoxGeometry(3,4.5,0.5),mat);w.position.set(x,2.3,z);scene.add(w);let c=document.createElement('canvas');c.width=128;c.height=64;let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,128,64);ctx.fillStyle='#000';ctx.font='bold 36px Fredoka';ctx.textAlign='center';ctx.fillText(v,64,44);let t=new THREE.CanvasTexture(c);let l=new THREE.Mesh(new THREE.PlaneGeometry(2.4,1.2),new THREE.MeshBasicMaterial({map:t}));l.position.set(x,2.3,z+0.35);scene.add(l);gates.push({w,l,x,z,ok:isOk});});}let joy=document.getElementById('joy'),stk=document.getElementById('stick'),jmp=document.getElementById('jump');let ja=false,jc={x:0,y:0};joy.addEventListener('touchstart',e=>{ja=true;let r=joy.getBoundingClientRect();jc={x:r.left+r.width/2,y:r.top+r.height/2};},{passive:false});addEventListener('touchmove',e=>{if(!ja)return;let t=e.touches[0];let dx=t.clientX-jc.x,dy=t.clientY-jc.y;let d=Math.min(48,Math.hypot(dx,dy));let a=Math.atan2(dy,dx);stk.style.transform=`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px))`;mx=Math.cos(a)*d/48;mz=Math.sin(a)*d/48;e.preventDefault();},{passive:false});addEventListener('touchend',()=>{ja=false;stk.style.transform='translate(-50%,-50%)';mx=0;mz=0;});jmp.addEventListener('touchstart',e=>{e.preventDefault();if(!jump){vy=9;jump=true;}},{passive:false});let nz=45;function loop(){if(over)return;requestAnimationFrame(loop);let dt=Math.min(0.05,clock.getDelta());if(run){player.position.x+=mx*10*dt;player.position.z+=mz*10*dt;player.position.x=Math.max(-10,Math.min(10,player.position.x));vy-=22*dt;y+=vy*dt;if(y<=0){y=0;vy=0;jump=false;}player.position.y=y;camera.position.lerp(new THREE.Vector3(player.position.x,5+y*0.4,player.position.z-10),0.12);camera.lookAt(player.position.x,1.2,player.position.z+6);let dx=player.position.x-ph.position.x,dz=player.position.z-ph.position.z,len=Math.hypot(dx,dz);if(len>1){ph.position.x+=dx/len*3.6*dt;ph.position.z+=dz/len*(3.2+score*0.01)*dt;}document.getElementById('b').innerText=len|0;if(mz<0)dist+=-mz*dt*18;document.getElementById('d').innerText=dist|0;gates.forEach((G,i)=>{if(Math.abs(player.position.z-G.z)<1.2&&Math.abs(player.position.x-G.x)<2){if(G.ok){score+=100;document.getElementById('s').innerText=score;ph.position.z-=7;}else{ph.position.z+=6;}scene.remove(G.w);scene.remove(G.l);gates.splice(i,1);if(gates.length<3){nz+=40;spawn(nz);}}});if(len<1.4){over=true;document.getElementById('f').innerText=`Jarak ${dist|0}m | Score ${score}`;document.getElementById('over').style.display='block';}}renderer.render(scene,camera);}window.start=()=>{document.getElementById('title').style.display='none';run=true;spawn(nz);nz+=40;};loop();</script></body></html>
